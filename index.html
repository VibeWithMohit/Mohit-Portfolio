    <script>
      // Runs before first paint: decide motion mode so nothing animates that
      // shouldn't. A stored choice from the in-page toggle wins over the OS.
      (function () {
        var root = document.documentElement;
        root.classList.add('js');
        var reduce = false;
        try {
          reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        } catch (e) {}
        var stored = null;
        try {
          stored = window.localStorage.getItem('sim:motion');
        } catch (e) {}
        root.setAttribute('data-motion', stored === 'on' || stored === 'off' ? stored : reduce ? 'off' : 'on');
      })();
    </script>
